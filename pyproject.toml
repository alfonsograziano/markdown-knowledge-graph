[project]
name = "mdkg"
version = "0.1.0"
description = "Build and explore a knowledge graph from a folder of markdown files, with Graphiti, Amazon Bedrock and Neo4j."
requires-python = ">=3.12,<3.14"
dependencies = [
  "graphiti-core[anthropic]==0.30.2",
  "anthropic[bedrock]>=1.12.1",
  "boto3>=1.39.16",
  "httpx>=0.28.0",  # graphiti-core imports it but does not declare it
  "neo4j>=5.26.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0",
]

[project.scripts]
mdkg = "mdkg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdkg"]
